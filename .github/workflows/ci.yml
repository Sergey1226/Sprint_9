name: Python Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      selenoid:
        image: aerokube/selenoid:latest-release
        ports:
          - 4444:4444
        options: >-
          --privileged
          -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ github.workspace }}/browsers.json:/etc/selenoid/browsers.json:ro

    steps:
    # Шаг 1: Получить код из репозитория
    - name: Checkout code
      uses: actions/checkout@v3
    
    # Шаг 2: Установить Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    # Шаг 3: Установить зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Шаг 4: Установить Allure (для отчетов)
    - name: Install Allure
      run: |
        sudo wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
        sudo tar -zxvf allure-2.24.1.tgz -C /opt/
        sudo ln -s /opt/allure-2.24.1/bin/allure /usr/bin/allure
    
    # Шаг 5: Создать конфиг браузеров
    - name: Create browsers.json
      run: |
        echo '{
          "chrome": {
            "default": "128.0",
            "versions": {
              "128.0": {
                "image": "selenoid/chrome:128.0",
                "port": "4444",
                "path": "/"
              }
            }
          }
        }' > browsers.json
    
    # Шаг 6: Подождать запуска Selenoid
    - name: Wait for Selenoid
      run: |
        sleep 10
        curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:4444/status
    
    # Шаг 7: Запустить тесты
    - name: Run tests
      env:
        SELENOID_URI: http://localhost:4444/wd/hub
      run: |
        pytest tests/ -v --alluredir=allure-results
    
    # Шаг 8: Сгенерировать отчет Allure
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report
    
    # Шаг 9: Сохранить отчет как артефакт
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-report
        path: allure-report
        retention-days: 30
    
    # Шаг 10: Опубликовать отчет на GitHub Pages (опционально)
    - name: Deploy Allure Report to GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        keep_files: true
