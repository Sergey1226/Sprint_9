name: Python Selenium Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Chrome стабильной версии
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        
        # Устанавливаем конкретную версию Chrome (128.0 как в browsers.json)
        wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y /tmp/chrome.deb --no-install-recommends
        rm /tmp/chrome.deb
        
        # Проверяем версию
        google-chrome --version
    
    - name: Install ChromeDriver
      run: |
        # Устанавливаем ChromeDriver 128.0 (совместимый с Chrome)
        wget -q https://storage.googleapis.com/chrome-for-testing-public/128.0.6613.137/linux64/chromedriver-linux64.zip
        unzip -o chromedriver-linux64.zip
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        chromedriver --version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install allure-pytest
    
    - name: Install Allure Commandline
      run: |
        # Устанавливаем Allure через npm (проще)
        sudo apt-get install -y npm
        sudo npm install -g allure-commandline --save-dev
        allure --version
    
    - name: Run tests
      run: |
        pytest tests/ -v --alluredir=allure-results
    
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report
    
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report
        retention-days: 30
