name: Python Selenium Tests with Selenoid

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      selenoid:
        image: aerokube/selenoid:latest-release  
        options: >-
          --privileged
          -v /var/run/docker.sock:/var/run/docker.sock
        env:
          OVERRIDE_VIDEO_OUTPUT_DIR: /opt/selenoid/video
          TZ: UTC
        ports:
          - 4444:4444
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Allure
      run: |
        sudo wget -q https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
        sudo tar -zxvf allure-2.24.1.tgz -C /opt/
        sudo ln -s /opt/allure-2.24.1/bin/allure /usr/bin/allure
    
    - name: Configure Selenoid
      run: |
        echo "Waiting for Selenoid container to start..."
        sleep 10
        
        # Создаем browsers.json напрямую в контейнере
        docker exec $(docker ps -q --filter "ancestor=aerokube/selenoid") sh -c "echo '{
          \"chrome\": {
            \"default\": \"128.0\",
            \"versions\": {
              \"128.0\": {
                \"image\": \"selenoid/chrome:128.0\",
                \"port\": \"4444\",
                \"path\": \"/\"
              }
            }
          }
        }' > /etc/selenoid/browsers.json"
        
        # Перезапускаем Selenoid с конфигом
        docker restart $(docker ps -q --filter "ancestor=aerokube/selenoid")
        sleep 10
    
    - name: Wait for Selenoid
      run: |
        echo "Testing Selenoid connection..."
        
        for i in {1..20}; do
          if curl -s http://localhost:4444/status > /dev/null; then
            echo "Selenoid is ready!"
            curl -s http://localhost:4444/status
            exit 0
          fi
          echo "Attempt $i: Selenoid not ready, waiting 3 seconds..."
          sleep 3
        done
        
        echo "ERROR: Selenoid failed to start"
        exit 1
    
    - name: Run tests with Selenoid
      env:
        SELENOID_URI: http://localhost:4444/wd/hub
      run: |
        pytest tests/ -v --alluredir=allure-results
    
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report
    
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report
        retention-days: 30
